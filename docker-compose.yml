name: geo-tracking

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://geo:${POSTGRES_PASSWORD:-geo}@db:5432/geo
  REDIS_URL: redis://redis:6379/0
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
  INGEST_BATCH_SIZE: ${INGEST_BATCH_SIZE:-2000}
  INGEST_FLUSH_INTERVAL_MS: ${INGEST_FLUSH_INTERVAL_MS:-200}
  STORE_LOCATION_HISTORY: ${STORE_LOCATION_HISTORY:-true}
  ALERT_REPEAT_INSIDE: ${ALERT_REPEAT_INSIDE:-true}

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: geo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geo}
      POSTGRES_DB: geo
    command: >
      postgres -c max_connections=200
               -c shared_buffers=256MB
               -c synchronous_commit=off
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo -d geo"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    environment: *app-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    environment:
      <<: *app-env
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
              --workers ${WEB_CONCURRENCY:-1}
              --loop uvloop --http httptools --ws websockets --proxy-headers
    ports:
      - "${APP_PORT:-8080}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # docker compose --profile load up generator
  generator:
    build: .
    profiles: ["load"]
    command: >
      python generator.py --url http://app:8000
             --devices ${GEN_DEVICES:-10000}
             --interval ${GEN_INTERVAL:-3}
             --connections ${GEN_CONNECTIONS:-20}
             --batch ${GEN_BATCH:-250}
    depends_on:
      app:
        condition: service_healthy

  # docker compose --profile test run --rm test
  test:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql+asyncpg://geo:${POSTGRES_PASSWORD:-geo}@db:5432/geo_test
      TEST_DATABASE_URL: postgresql+asyncpg://geo:${POSTGRES_PASSWORD:-geo}@db:5432/geo_test
    command: ["pytest", "-q"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
