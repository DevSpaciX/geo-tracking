<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill:#f8fafc; stroke:#94a3b8; stroke-width:1.5; rx:8; }
      .proc { fill:#eff6ff; stroke:#3b82f6; stroke-width:1.5; rx:8; }
      .store { fill:#f0fdf4; stroke:#22c55e; stroke-width:1.5; rx:8; }
      .bus { fill:#fef3c7; stroke:#f59e0b; stroke-width:1.5; rx:8; }
      .title { font-weight:600; fill:#0f172a; }
      .sub { fill:#475569; font-size:11.5px; }
      .edge { stroke:#475569; stroke-width:1.5; fill:none; marker-end:url(#arrow); }
      .lbl { fill:#334155; font-size:11px; }
    </style>
  </defs>

  <!-- devices -->
  <rect class="box" x="20" y="40" width="150" height="90"/>
  <text class="title" x="95" y="65" text-anchor="middle">Devices</text>
  <text class="sub" x="95" y="84" text-anchor="middle">generator.py: 10 000</text>
  <text class="sub" x="95" y="100" text-anchor="middle">POST /api/locations</text>
  <text class="sub" x="95" y="116" text-anchor="middle">WS /ws/ingest</text>

  <!-- app process -->
  <rect x="210" y="20" width="540" height="300" fill="none" stroke="#cbd5e1" stroke-dasharray="6 4" rx="12"/>
  <text class="sub" x="220" y="38">FastAPI process (×N with Redis)</text>

  <rect class="proc" x="230" y="55" width="130" height="60"/>
  <text class="title" x="295" y="80" text-anchor="middle">API handlers</text>
  <text class="sub" x="295" y="98" text-anchor="middle">validate, enqueue</text>

  <rect class="proc" x="375" y="55" width="210" height="60"/>
  <text class="title" x="480" y="80" text-anchor="middle">Bounded queue</text>
  <text class="sub" x="480" y="98" text-anchor="middle">full → 503 / TCP back-pressure</text>

  <rect class="proc" x="605" y="55" width="130" height="60"/>
  <text class="title" x="670" y="80" text-anchor="middle">Batch worker</text>
  <text class="sub" x="670" y="98" text-anchor="middle">≤2000 pts / 200 ms</text>

  <rect class="proc" x="400" y="180" width="310" height="110"/>
  <text class="title" x="555" y="203" text-anchor="middle">ConnectionManager</text>
  <text class="sub" x="555" y="222" text-anchor="middle">user_id → {session_id → connection}</text>
  <text class="sub" x="555" y="240" text-anchor="middle">sender task + bounded buffers per socket</text>
  <text class="sub" x="555" y="258" text-anchor="middle">viewport (bbox) filter per session</text>
  <text class="sub" x="555" y="276" text-anchor="middle">alerts: all sessions of the owner · locations: everyone</text>

  <!-- postgis -->
  <rect class="store" x="790" y="40" width="170" height="130"/>
  <text class="title" x="875" y="65" text-anchor="middle">PostgreSQL + PostGIS</text>
  <text class="sub" x="875" y="86" text-anchor="middle">geozones (bounds GiST)</text>
  <text class="sub" x="875" y="102" text-anchor="middle">devices (last position)</text>
  <text class="sub" x="875" y="118" text-anchor="middle">device_locations (history)</text>
  <text class="sub" x="875" y="134" text-anchor="middle">zone_presence (enter/exit)</text>
  <text class="sub" x="875" y="156" text-anchor="middle" font-style="italic">3 set-based statements / batch</text>

  <!-- redis -->
  <rect class="bus" x="790" y="200" width="170" height="70"/>
  <text class="title" x="875" y="226" text-anchor="middle">Redis pub/sub</text>
  <text class="sub" x="875" y="244" text-anchor="middle">geo:locations · geo:alerts</text>
  <text class="sub" x="875" y="260" text-anchor="middle">fan-out across processes</text>

  <!-- clients -->
  <rect class="box" x="230" y="380" width="200" height="100"/>
  <text class="title" x="330" y="405" text-anchor="middle">alice · laptop</text>
  <text class="sub" x="330" y="424" text-anchor="middle">WS /ws/live?user_id=alice</text>
  <text class="sub" x="330" y="442" text-anchor="middle">Leaflet map + alert feed</text>
  <text class="sub" x="330" y="460" text-anchor="middle">REST /api/geozones</text>

  <rect class="box" x="470" y="380" width="200" height="100"/>
  <text class="title" x="570" y="405" text-anchor="middle">alice · phone</text>
  <text class="sub" x="570" y="424" text-anchor="middle">second session, same user</text>
  <text class="sub" x="570" y="442" text-anchor="middle">receives the same alerts</text>

  <rect class="box" x="710" y="380" width="200" height="100"/>
  <text class="title" x="810" y="405" text-anchor="middle">bob</text>
  <text class="sub" x="810" y="424" text-anchor="middle">own zones, own alerts</text>
  <text class="sub" x="810" y="442" text-anchor="middle">sees all device positions</text>

  <!-- edges -->
  <path class="edge" d="M170,85 L230,85"/>
  <path class="edge" d="M360,85 L375,85"/>
  <path class="edge" d="M585,85 L605,85"/>
  <path class="edge" d="M735,85 L790,85"/>
  <text class="lbl" x="700" y="48">insert · upsert · evaluate</text>
  <path class="edge" d="M790,110 L735,110"/>
  <text class="lbl" x="700" y="134">enter / inside / exit</text>

  <path class="edge" d="M700,115 C700,165 790,150 790,215"/>
  <text class="lbl" x="735" y="178">publish</text>
  <path class="edge" d="M790,250 L710,250"/>
  <text class="lbl" x="722" y="243">subscribe</text>

  <path class="edge" d="M470,290 L330,380"/>
  <path class="edge" d="M555,290 L565,380"/>
  <path class="edge" d="M640,290 L800,380"/>
  <text class="lbl" x="372" y="345">locations + alerts</text>
  <text class="lbl" x="690" y="345">locations only</text>

  <text class="sub" x="20" y="500">Back-pressure: bounded queue → HTTP 503 + Retry-After for REST producers, unread frames (TCP) for WebSocket producers.</text>
  <text class="sub" x="20" y="516">Slow consumers: the oldest location batches are dropped per socket, alerts are kept.</text>
</svg>
